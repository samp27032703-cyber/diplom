{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card-custom p-4 text-center">
            <h3 class="fw-bold mb-4">Регистрация</h3>
            <form method="POST">
                <div class="mb-3 text-start">
                    <label class="form-label">Придумайте логин</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label">Придумайте пароль</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary-custom w-100">Создать аккаунт</button>
            </form>
            <div class="mt-4 text-center">
                Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
