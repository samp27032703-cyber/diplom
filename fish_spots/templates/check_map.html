<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Проверка карты</title>
    <!-- ВСТАВЬ СЮДА НОВЫЙ КЛЮЧ (старый лучше не использовать!) -->
    <script src="https://api-maps.yandex.ru/2.1/?apikey=НОВЫЙ_КЛЮЧ_ЗДЕСЬ&lang=ru_RU" type="text/javascript"></script>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { width: 100%; height: 100vh; background: #333; } /* Черный фон, чтобы видеть, если тайлы не грузятся */
        .status { position: absolute; top: 20px; left: 20px; color: white; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; z-index: 100; }
    </style>
</head>
<body>
    <div class="status">
        <h3>Статус:</h3>
        <p id="msg">Ожидание загрузки API...</p>
    </div>
    <div id="map"></div>

    <script>
        document.getElementById('msg').innerText = 'Скрипт загружен. Ждем готовности API...';
        
        ymaps.ready(function () {
            document.getElementById('msg').style.color = '#4ade80'; // Зеленый цвет
            document.getElementById('msg').innerText = 'API готов! Рисуем карту...';
            
            try {
                var myMap = new ymaps.Map("map", { 
                    center: [55.75, 37.6], 
                    zoom: 9 
                });
                myMap.geoObjects.add(new ymaps.Placemark([55.75, 37.6], {
                    balloonContent: 'Это тестовая метка!'
                }, {
                    preset: 'islands#redCircleDotIcon'
                }));
            } catch (e) {
                document.getElementById('msg').style.color = '#ef4444';
                document.getElementById('msg').innerText = 'Ошибка создания карты: ' + e.message;
            }
        });

        if (typeof ymaps === 'undefined') {
            document.getElementById('msg').style.color = '#ef4444';
            document.getElementById('msg').innerText = 'КРИТИЧЕСКАЯ ОШИБКА: ymaps не найден. Скрипт не загрузился.';
        }
    </script>
</body>
</html>
