{% extends "base.html" %}
{% block content %}
<div class="hero-section text-start">
    <h2 class="fw-bold">Добавить рыбное место</h2>
    <p class="text-muted">Отметьте точку на карте или введите адрес</p>
</div>

<form method="POST" id="addSpotForm" class="row g-4">
    <!-- Левая колонка: поля -->
    <div class="col-md-6">
        <div class="mb-3">
            <label class="form-label fw-semibold">Название места</label>
            <input type="text" name="title" class="form-control form-control-lg" required placeholder="Озеро Лесное">
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Локация (адрес)</label>
            <input type="text" id="locationInput" name="location" class="form-control" placeholder="Московская обл., река Волга">
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Виды рыбы</label>
            <input type="text" name="fish_types" class="form-control" placeholder="щука, окунь, плотва">
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Ссылка на фото</label>
            <input type="url" name="image_url" class="form-control" placeholder="https://...">
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Описание</label>
            <textarea name="description" class="form-control" rows="3" placeholder="Тихое место, хороший подъезд..."></textarea>
        </div>
    </div>

    <!-- Правая колонка: карта -->
    <div class="col-md-6">
        <label class="form-label fw-semibold">Отметьте место на карте</label>
        <div id="map" style="width: 100%; height: 400px; border: 1px solid #dee2e6; border-radius: 12px;"></div>
    </div>

    <input type="hidden" id="latInput" name="latitude">
    <input type="hidden" id="lonInput" name="longitude">

    <div class="col-12">
        <button type="submit" class="btn btn-primary-custom text-white px-4 py-2 fw-medium">
            <i class="fa-solid fa-location-dot me-2"></i> Сохранить место
        </button>
    </div>
</form>

<!-- ⚠️ ВСТАВЬ СЮДА СВОЙ API КЛЮЧ ОТ ЯНДЕКС КАРТ ВМЕСТО ВАШ_API_КЛЮЧ -->
<script src="https://api-maps.yandex.ru/2.1/?apikey=c93f4bb5-f693-4e75-b427-3c652781bf38&lang=ru_RU" type="text/javascript"></script>

<script>
    ymaps.ready(init);
    let myMap, myPlacemark;

    function init() {
        myMap = new ymaps.Map("map", { center: [55.75, 37.6], zoom: 5 });
        const locInput = document.getElementById('locationInput');
        const latInput = document.getElementById('latInput');
        const lonInput = document.getElementById('lonInput');

        // Клик по карте → ставим метку
        myMap.events.add('click', function (e) {
            const coords = e.get('coords');
            if (myPlacemark) myMap.geoObjects.remove(myPlacemark);
            myPlacemark = new ymaps.Placemark(coords, { balloonContent: 'Точка места' }, { preset: 'islands#blueCircleDotIcon' });
            myMap.geoObjects.add(myPlacemark);
            latInput.value = coords[0];
            lonInput.value = coords[1];
        });

        // Геокодирование по адресу
        locInput.addEventListener('change', function () {
            const address = locInput.value;
            if (!address) return;
            ymaps.geocode(address).then(function (res) {
                const firstGeoObject = res.geoObjects.get(0);
                if (firstGeoObject) {
                    const coords = firstGeoObject.geometry.getCoordinates();
                    if (myPlacemark) myMap.geoObjects.remove(myPlacemark);
                    myPlacemark = new ymaps.Placemark(coords, { balloonContent: address }, { preset: 'islands#blueCircleDotIcon' });
                    myMap.geoObjects.add(myPlacemark);
                    myMap.setCenter(coords, 15);
                    latInput.value = coords[0];
                    lonInput.value = coords[1];
                }
            });
        });
    }
</script>
{% endblock %}
